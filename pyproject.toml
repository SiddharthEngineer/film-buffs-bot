[project]
name = "film-buffs-bot"
version = "0.4.0"
description = "Private Discord bot for the Film Buffs server"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.7,<3",
    "aiohttp>=3.10",
    "feedparser>=6.0",
    "aiosqlite>=0.20",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "tzdata",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false   # an app run from this folder, not an installable package

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
