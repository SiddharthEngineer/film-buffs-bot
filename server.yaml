# Declared state of the Film Buffs server.
# Edit this file, then run:  python setup_server.py --plan   (then --apply)
#
# Every category, channel, tag and message has a stable `key`. The setup
# script tracks the Discord ID behind each key, so renaming something here
# renames it in Discord instead of creating a duplicate. Never change a key.
#
# Permission targets in `overwrites`:
#   "@everyone"  the default role
#   "@bot"       this bot's own role
#   any other    a role name (must already exist; roles are not managed)
# Only the targets listed are managed. Other overwrites on a channel are
# reported and left alone.

timezone: America/Chicago

# Put managed categories above any unmanaged ones (unmanaged keep their
# relative order). Set to false to leave category order alone.
managed_categories_first: true

# Discord allows 5 tags per post. Status tags always win; at most this many
# genre tags fill the remaining slots.
max_genre_tags: 3

# Reusable permission sets.
presets:
  read_only:
    "@everyone":
      deny: [send_messages, send_messages_in_threads, create_public_threads, create_private_threads]
    "@bot":
      allow: [view_channel, send_messages, embed_links]
  admin_only:
    "@everyone":
      deny: [view_channel]
    "@bot":
      allow: [view_channel, send_messages, embed_links]

categories:
  - key: info
    name: "📢 Info"
    channels:
      - key: welcome
        name: welcome-and-rules
        topic: "Start here: how this server works."
        preset: read_only
      - key: announcements
        name: announcements
        topic: "Watch-week announcements and server news."
        preset: read_only

  - key: chat
    name: "💬 Chat"
    channels:
      - key: general
        name: general
        adopt: general          # take over the existing #general instead of creating one
      - key: trailers
        name: trailers-and-news
        topic: "Trailers, release news, festival buzz."

  - key: movies
    name: "🎬 Movies"
    channels:
      - key: movies
        name: movies
        type: forum
        default_sort: latest_activity
        topic: |
          One post per movie. Posts are created by the bot. Use /addmovie in any channel to add a film (pick it from the autocomplete list).
          👍 the first message of a post to vote for it in the weekly pick.
          Posts here are always spoiler-free. Every movie has a separate spoiler discussion in #movie-spoilers: click 🔓 Spoiler discussion on the movie's info card (or run /spoiler inside the post) to open it.
          Slipped up? Right-click (long-press on mobile) a message → Apps → Mark as spoiler moves it to the spoiler discussion. Nothing else in the post moves.
        overwrites:
          "@everyone":
            allow: [send_messages_in_threads]
            deny: [send_messages]          # "Create Posts" in a forum
          "@bot":
            allow: [view_channel, send_messages, send_messages_in_threads, embed_links, manage_threads]
        tags:
          # Status tags: moderated = only members with Manage Threads (the bot) can apply them.
          - {key: backlog,     name: "Backlog",        emoji: "📋", moderated: true}
          - {key: up_next,     name: "Up Next",        emoji: "⏭️", moderated: true}
          - {key: watched,     name: "Watched",        emoji: "✅", moderated: true}
          - {key: watched_solo, name: "Watched (solo)", emoji: "👤", moderated: true}
          # "spoilers" = this movie has a spoiler discussion in #movie-spoilers (key kept so the ID survives).
          - {key: spoilers,    name: "Post-watch",     emoji: "🍿", moderated: true}
          - {key: in_theaters, name: "In Theaters",    emoji: "🎟️", moderated: true}
          - {key: streaming,   name: "Streaming",      emoji: "📺", moderated: true}
          # Genre tags. tmdb_genres = TMDB genre names that map to this tag.
          - {key: g_action,    name: "Action",      tmdb_genres: [Action, War, Western]}
          - {key: g_adventure, name: "Adventure",   tmdb_genres: [Adventure]}
          - {key: g_animation, name: "Animation",   tmdb_genres: [Animation]}
          - {key: g_comedy,    name: "Comedy",      tmdb_genres: [Comedy]}
          - {key: g_crime,     name: "Crime",       tmdb_genres: [Crime, Mystery]}
          - {key: g_doc,       name: "Documentary", tmdb_genres: [Documentary]}
          - {key: g_drama,     name: "Drama",       tmdb_genres: [Drama, History]}
          - {key: g_fantasy,   name: "Fantasy",     tmdb_genres: [Fantasy, Family]}
          - {key: g_horror,    name: "Horror",      tmdb_genres: [Horror]}
          - {key: g_romance,   name: "Romance",     tmdb_genres: [Romance, Music]}
          - {key: g_scifi,     name: "Sci-Fi",      tmdb_genres: [Science Fiction]}
          - {key: g_thriller,  name: "Thriller",    tmdb_genres: [Thriller]}
          # 19 of Discord's 20-tag limit used.
      - key: movie_spoilers
        name: movie-spoilers
        type: forum
        default_sort: latest_activity
        topic: |
          Spoilers allowed, no warnings needed. One post per movie, created by the bot when someone first opens a movie's spoiler discussion.
          Each post links back to the movie's spoiler-free post in #movies. Vote with 👍 there, not here.
        overwrites:
          "@everyone":
            allow: [send_messages_in_threads]
            deny: [send_messages]          # only the bot creates posts
          "@bot":
            allow: [view_channel, send_messages, send_messages_in_threads, embed_links, manage_threads]

  - key: planning
    name: "📅 Planning"
    channels:
      - key: watch_planning
        name: watch-planning
        topic: "Weekly movie poll opens Monday 12:00 AM CT and closes Sunday 11:59 PM CT. Chat welcome."
      - key: watch_log
        name: watch-log
        topic: "One line per weekly pick."
        preset: read_only
      - key: letterboxd_feed
        name: letterboxd-feed
        topic: "New Letterboxd reviews from linked members (full reviews are in each movie's post)."
        preset: read_only

  - key: voice
    name: "🔊 Voice"
    channels:
      - key: watch_party
        name: Watch Party
        type: voice
        adopt: Stream Room      # existing voice channel, renamed
      - key: discussions
        name: Discussions
        type: voice
        adopt: Lounge           # existing voice channel, renamed

  - key: admin
    name: "🔧 Admin"
    channels:
      - key: bot_logs
        name: bot-logs
        topic: "Bot errors and health notices. Admins only."
        preset: admin_only

# Messages the bot posts and keeps up to date. {#key} becomes a channel link.
messages:
  - key: welcome_rules
    channel: welcome
    title: "🎬 Welcome to Film Buffs"
    description: |
      A place to pick, watch and talk about movies together.

      **How it works**
      • Every movie gets its own post in {#movies}. Add one with **/addmovie** from any channel: start typing a title and pick it from the list. Add a pitch if you want to sell it.
      • 👍 the first message of a post to vote for it. Every Monday a poll in {#watch-planning} picks next week's movie from the most-liked posts.
      • Winners are logged in {#watch-log}. Watch-week dates show up as server events.

      **Spoiler policy**
      • {#movies} is always spoiler-free. Talk about trailers, hype and first impressions there.
      • Every movie has its own spoiler discussion in {#movie_spoilers}. Click **🔓 Spoiler discussion** on a movie's info card, or run **/spoiler** inside its post. Posts with a spoiler discussion get the 🍿 Post-watch tag.
      • Someone slipped? Right-click (long-press on mobile) their message → **Apps → Mark as spoiler**. The bot moves it to the spoiler discussion; nothing else in the post moves.
      • Outside movie posts, always use `||spoiler bars||`.

      **Letterboxd**
      • Run **/letterboxd** with your username to link your account. New diary entries show up in {#letterboxd-feed} and the movie's post; ratings and reviews go in its spoiler discussion. **/letterboxd-unlink** to stop.

      **Be nice.** Disagree about movies, not about people.
    color: 0xE5A00D

# Unmanaged channels to delete, by ID. The name must still match, text
# channels with messages are refused unless allow_messages: true, and a
# category is only deleted once it is empty. Entries for channels that are
# already gone are ignored, so these can stay here as a record.
retire:
  - {id: 1569765385744425052, name: games}            # empty
  - {id: 1569765385744425053, name: music}            # empty
  - {id: 1569765385744425050, name: Text Channels}    # empty once #general moves
  - {id: 1569765385744425054, name: Voice Channels}   # empty once voice channels move
