# Declared state of the Film Buffs server.
# Edit this file, then run:  python setup_server.py --plan   (then --apply)
#
# Every category, channel, tag and message has a stable `key`. The setup
# script tracks the Discord ID behind each key, so renaming something here
# renames it in Discord instead of creating a duplicate. Never change a key.
#
# Permission targets in `overwrites`:
#   "@everyone"  the default role
#   "@bot"       this bot's own role
#   any other    a role name (must already exist; roles are not managed)
# Only the targets listed are managed. Other overwrites on a channel are
# reported and left alone.

timezone: America/Chicago

# Put managed categories above any unmanaged ones (unmanaged keep their
# relative order). Set to false to leave category order alone.
managed_categories_first: true

# Discord allows 5 tags per post. Status tags always win; at most this many
# genre tags fill the remaining slots.
max_genre_tags: 3

# Letterboxd RSS polling (Phase 4). Feeds are fetched one after another with a
# random pause between them, so the bot never hits Letterboxd in a burst.
letterboxd:
  poll_minutes: 15
  jitter_seconds: [3, 12]

# Weekly pick (Phase 5R), America/Chicago. For each watch week (Mon 12:00 AM to
# Sun 11:59 PM), the week before it runs nominations Mon 12:00 AM → Thu 11:59 PM
# and a ranked-choice vote Fri 12:00 AM → Sun 11:59 PM (instant runoff).
#   first_watch_week: Monday of the first watch week (its nominations open the
#     Monday before, or right away if that's already past). Nothing runs before it.
#   Only nominated films are on the ballot (one per member, at most 25: Discord's
#   dropdown limit).
#   No nominations skips the week; a single nomination wins without a vote.
#   tie_break: for ties when a film has to go out of the runoff, after fewest 1st
#     choices: interest (members who 👍'd or have it on their uploaded watchlist),
#     thumbs (👍 only), added (the film added last goes out first).
weekly:
  first_watch_week: 2026-11-16
  tie_break: [interest, thumbs, added]
  leaderboard_size: 25

# Ops (Phase 7). Nightly SQLite backup into backups/ at backup_time (local time,
# see `timezone`), keeping the newest backup_keep of them. /admin commands are for
# members with Manage Server or the admin_role.
ops:
  backup_time: "04:00"
  backup_keep: 3
  admin_role: Moderator

# Reusable permission sets.
presets:
  read_only:
    "@everyone":
      deny: [send_messages, send_messages_in_threads, create_public_threads, create_private_threads]
    "@bot":
      allow: [view_channel, send_messages, embed_links]
  admin_only:
    "@everyone":
      deny: [view_channel]
    "@bot":
      allow: [view_channel, send_messages, embed_links]

categories:
  - key: info
    name: "📢 Info"
    channels:
      - key: welcome
        name: welcome-and-rules
        topic: "Start here: how this server works."
        preset: read_only
      - key: announcements
        name: announcements
        topic: "Watch-week announcements and server news."
        preset: read_only

  - key: chat
    name: "💬 Chat"
    channels:
      - key: general
        name: general
        adopt: general          # take over the existing #general instead of creating one
      - key: trailers
        name: trailers-and-news
        topic: "Trailers, release news, festival buzz."

  - key: movies
    name: "🎬 Movies"
    channels:
      - key: movies
        name: movies
        type: forum
        default_sort: latest_activity
        topic: |
          🚫 NO SPOILERS in this channel. Talk about trailers, hype and first impressions only.
          One post per movie, created by the bot. Use /addmovie in any channel to add a film (pick it from the autocomplete list). 👍 the first message of a post if you want to watch it: the pinned 🏆 Most wanted message in #watch-planning (and /top) ranks every film by 👍. Want it picked? /nominate it for the weekly ballot. This week's movie is pinned at the top of this channel.
          Seen it? Every movie has a post-watch discussion in #post-watch-discussion where spoilers are allowed: click 🔓 Post-watch discussion on the movie's info card (or run /spoiler inside the post).
          Slipped up? Right-click (long-press on mobile) a message → Apps → Mark as spoiler moves it to the post-watch discussion. Nothing else in the post moves.
        overwrites:
          "@everyone":
            allow: [send_messages_in_threads]
            deny: [send_messages]          # "Create Posts" in a forum
          "@bot":
            allow: [view_channel, send_messages, send_messages_in_threads, embed_links, manage_threads]
        tags:
          # Status tags: moderated = only members with Manage Threads (the bot) can apply them.
          - {key: backlog,     name: "Backlog",        emoji: "📋", moderated: true}
          - {key: up_next,     name: "Up Next",        emoji: "⏭️", moderated: true}
          - {key: watched,     name: "Watched",        emoji: "✅", moderated: true}
          - {key: watched_solo, name: "Watched (solo)", emoji: "👤", moderated: true}
          - {key: in_theaters, name: "In Theaters",    emoji: "🎟️", moderated: true}
          - {key: streaming,   name: "Streaming",      emoji: "📺", moderated: true}
          # Genre tags. tmdb_genres = TMDB genre names that map to this tag.
          - {key: g_action,    name: "Action",      tmdb_genres: [Action, War, Western]}
          - {key: g_adventure, name: "Adventure",   tmdb_genres: [Adventure]}
          - {key: g_animation, name: "Animation",   tmdb_genres: [Animation]}
          - {key: g_comedy,    name: "Comedy",      tmdb_genres: [Comedy]}
          - {key: g_crime,     name: "Crime",       tmdb_genres: [Crime, Mystery]}
          - {key: g_doc,       name: "Documentary", tmdb_genres: [Documentary]}
          - {key: g_drama,     name: "Drama",       tmdb_genres: [Drama, History]}
          - {key: g_fantasy,   name: "Fantasy",     tmdb_genres: [Fantasy, Family]}
          - {key: g_horror,    name: "Horror",      tmdb_genres: [Horror]}
          - {key: g_romance,   name: "Romance",     tmdb_genres: [Romance, Music]}
          - {key: g_scifi,     name: "Sci-Fi",      tmdb_genres: [Science Fiction]}
          - {key: g_thriller,  name: "Thriller",    tmdb_genres: [Thriller]}
          # 18 of Discord's 20-tag limit used.
        retire_tags:
          # Was "this movie has a post-watch discussion"; the info card button shows that.
          - {key: spoilers, name: "Post-watch"}
      - key: movie_spoilers
        name: post-watch-discussion
        type: forum
        default_sort: latest_activity
        topic: |
          ⚠️ SPOILERS ALLOWED. Only open a movie's post once you've seen it.
          One post per movie, created by the bot when someone first opens a movie's post-watch discussion. Each post links back to the movie's spoiler-free post in #movies. Vote with 👍 there, not here.
        overwrites:
          "@everyone":
            allow: [send_messages_in_threads]
            deny: [send_messages]          # only the bot creates posts
          "@bot":
            allow: [view_channel, send_messages, send_messages_in_threads, embed_links, manage_threads]

  - key: planning
    name: "📅 Planning"
    channels:
      - key: watch_planning
        name: watch-planning
        topic: "Weekly pick for next week: /nominate Mon–Thu, ranked vote Fri–Sun (click Vote on the ballot). /schedule shows this week's movie and what's open. Chat welcome."
      - key: watch_log
        name: watch-log
        topic: "One line per weekly pick."
        preset: read_only
      - key: letterboxd_feed
        name: letterboxd-feed
        topic: "New Letterboxd diary entries from linked members. Ratings and reviews are in each movie's post-watch discussion."
        preset: read_only

  - key: voice
    name: "🔊 Voice"
    channels:
      - key: watch_party
        name: Watch Party
        type: voice
        adopt: Stream Room      # existing voice channel, renamed
      - key: discussions
        name: Discussions
        type: voice
        adopt: Lounge           # existing voice channel, renamed

  - key: admin
    name: "🔧 Admin"
    channels:
      - key: bot_logs
        name: bot-logs
        topic: "Bot errors and health notices. Admins only."
        preset: admin_only

# Messages the bot posts and keeps up to date. {#key} becomes a channel link.
messages:
  - key: welcome_rules
    channel: welcome
    title: "🎬 Welcome to Film Buffs"
    description: |
      A place to pick, watch and talk about movies together.

      **Every week we:**
      🍿 Watch the same movie
      🗳️ Pick next week's movie together
      • Mon–Thu → nominate
      • Fri–Sun → vote

      💬 **Every movie gets its own discussions**
      • Pre-watch in {#movies}: hype, predictions, first impressions (no spoilers)
      • Post-watch in {#movie_spoilers}: reviews, hot takes, spoilers allowed

      📒 **Letterboxd is hooked up**, so everyone's reviews and watchlists post to the right channels automatically.

      📊 **Coming next: stats!**
      🎥 Movies: all-time rankings, most controversial picks, and more
      🙋 Us: who reviews the most, who contributes the most, who's the harshest critic 👀

      🤖 Siddharth is building this with Claude. Got an idea to make it better? Send it over!

      **Be nice.** Disagree about movies, not about people.

      👇 **How to do all of this is in the next message.**
    color: 0xE5A00D

  - key: how_to
    channel: welcome
    title: "📖 How to"
    description: |
      **Movies and 👍**
      • Every movie gets its own post in {#movies}. Add one with **/addmovie** from any channel: start typing a title and pick it from the list. Add a pitch if you want to sell it.
      • 👍 the first message of a post if you want to watch it. The pinned **🏆 Most wanted** message in {#watch_planning} (and **/top**) ranks every film by 👍.

      **Weekly pick** (all times CT; next week's movie is decided this week)
      • **Mon–Thu, nominate:** **/nominate** one film for the ballot in {#watch_planning}. Run it again to swap, or **/unnominate**, any time until Thursday night. Only nominated films are on the ballot; if there's just one, it wins without a vote.
      • **Fri–Sun, vote:** click **🗳️ Vote** on the ballot and rank as many films as you like, best first. Change your ranking any time until Sunday night. Votes are counted by instant runoff: if your 1st choice is knocked out, your vote moves to your 2nd, and so on, so ranking more never hurts.
      • **Watch week (Mon–Sun):** the winner is tagged Up Next, gets a server event and an announcement in {#announcements}, and is pinned at the top of {#movies} and {#movie_spoilers} for its week. It's logged in {#watch_log} at the end. **/schedule** shows what's on.

      **Spoiler policy**
      • {#movies} is spoiler-free: trailers, hype and first impressions only.
      • Seen it? Every movie has its own post in {#movie_spoilers}, where spoilers are allowed. Click **🔓 Post-watch discussion** on a movie's info card, or run **/spoiler** inside its post.
      • Someone slipped? Right-click (long-press on mobile) their message → **Apps → Mark as spoiler**. The bot moves it to the post-watch discussion; nothing else in the post moves.
      • Outside movie posts, always use `||spoiler bars||`.

      **Letterboxd**
      • Run **/letterboxd link** with your username to link your account. New diary entries show up in {#letterboxd_feed} and the movie's post; ratings and reviews go in its post-watch discussion. **/letterboxd unlink** to stop.
      • Optional: **/letterboxd sync** your Letterboxd export zip. It brings in your history, applies edits and deletions you made on Letterboxd, and each film on your watchlist counts toward the rankings like your 👍 would (shown as 📋 in **/top** and the leaderboard; the bot can't add a 👍 for you). Upload a fresh export whenever you want to update it.
    color: 0xE5A00D

# Unmanaged channels to delete, by ID. The name must still match, text
# channels with messages are refused unless allow_messages: true, and a
# category is only deleted once it is empty. Entries for channels that are
# already gone are ignored, so these can stay here as a record.
retire:
  - {id: 1569765385744425052, name: games}            # empty
  - {id: 1569765385744425053, name: music}            # empty
  - {id: 1569765385744425050, name: Text Channels}    # empty once #general moves
  - {id: 1569765385744425054, name: Voice Channels}   # empty once voice channels move
