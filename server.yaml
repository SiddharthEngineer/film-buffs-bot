# Declared state of the Film Buffs server.
# Edit this file, then run:  python setup_server.py --plan   (then --apply)
#
# Every category, channel, tag and message has a stable `key`. The setup
# script tracks the Discord ID behind each key, so renaming something here
# renames it in Discord instead of creating a duplicate. Never change a key.
#
# Permission targets in `overwrites`:
#   "@everyone"  the default role
#   "@bot"       this bot's own role
#   any other    a role name (must already exist; roles are not managed)
# Only the targets listed are managed. Other overwrites on a channel are
# reported and left alone.

timezone: America/Chicago

# Put managed categories above any unmanaged ones (unmanaged keep their
# relative order). Set to false to leave category order alone.
managed_categories_first: true

# Discord allows 5 tags per post. Status tags always win; at most this many
# genre tags fill the remaining slots.
max_genre_tags: 3

# Letterboxd RSS polling (Phase 4). Feeds are fetched one after another with a
# random pause between them, so the bot never hits Letterboxd in a burst.
letterboxd:
  poll_minutes: 15
  jitter_seconds: [3, 12]

# Weekly pick (Phase 10), America/Chicago. Members have one nomination each
# (/nominate; Phase 19), and several can nominate the same film. The ballot is
# every eligible nominated film (at most 25: Discord's dropdown limit).
# For each watch week (Mon 12:00 AM to Sun 11:59 PM), its ranked-choice vote
# (instant runoff) runs the whole week before: Mon 12:00 AM → Sun 11:59 PM.
# Rankings carry over from week to week.
#   first_watch_week: Monday of the first watch week. Nothing runs before it.
#   An empty ballot skips the week; a single film wins without a vote.
#   tie_break: for ties when a film has to go out of the runoff, after fewest 1st
#     choices: interest (members with it on their Letterboxd watchlist),
#     added (the film added last goes out first). 👍 reactions don't count.
weekly:
  first_watch_week: 2026-11-16
  tie_break: [interest, added]

# Private groups (Phase 12). Each entry gets a membership role (assign it in
# Discord), an opt-in "<role> Pings" role (members toggle it with 🔔 Pings on
# the group's ballot; its announcements ping it), a category, and
# #watch-planning, #watch-log, #chat and #voice that only the role and the bot can see (the server owner and Administrator roles
# always see everything). Each group has its own /nominate pool and its own
# monthly movie: month M is voted on during M-1 (1st 12:00 AM → last day
# 11:59 PM), watched during M, and discussed in the group's #voice on the 1st of
# M+1 at discussion_time. Nothing about a group shows outside its category, and
# its picks never change tags in #movies. A group can pick any film it hasn't
# already watched itself. Never change a group's key.
#   key: 1-20 lowercase letters/digits   name: category and display name
#   role: role name (default: name)      category: category name (default: name)
#   ping_role: ping role name (default: "<role> Pings")
#   first_month: YYYY-MM of its first movie (default: the next month)
groups:
  - key: osu
    name: OSU/Canton            # was OSU (Phase 26); the key stays osu
    category: "🏈 OSU/Canton"
    first_month: "2026-12"
    discussion_time: "20:00"
    discussion_minutes: 120

# Roles the setup script creates and keeps in sync (by key). Members opt in
# with 🔔 Pings on the weekly ballot; pick announcements in #watch-log ping
# them, and the 9 AM reminders (Phase 25) mention those who still need to act. The bot's own
# role must stay above them (new roles are created at the bottom).
roles:
  - key: weekly_ping
    name: Weekly Pings
    mentionable: true

# Roles this script created that should be deleted (key + current name).
retire_roles:
  - {key: monthly_ping, name: Monthly Movie}     # the main monthly movie moved to groups (Phase 12)

# Ops (Phase 7). Nightly SQLite backup into backups/ at backup_time (local time,
# see `timezone`), keeping the newest backup_keep of them. /admin commands are for
# members with Manage Server (or Administrator), plus admin_role if set
# (null = no extra role).
ops:
  backup_time: "04:00"
  backup_keep: 3
  admin_role: null

# Reusable permission sets.
presets:
  read_only:
    "@everyone":
      deny: [send_messages, send_messages_in_threads, create_public_threads, create_private_threads]
    "@bot":
      allow: [view_channel, send_messages, embed_links]
  admin_only:
    "@everyone":
      deny: [view_channel]
    "@bot":
      allow: [view_channel, send_messages, embed_links]

categories:
  # Phase 18: one category for the everyday channels (was 📢 Info, 💬 Chat,
  # 📅 Planning and 🔊 Voice).
  - key: info
    name: "🎬 Film Buffs"
    channels:
      - key: welcome
        name: welcome
        topic: "Start here: how this server works."
        preset: read_only
      - key: general
        name: general
        adopt: general          # take over the existing #general instead of creating one
      - key: watch_planning
        name: watch-planning
        topic: "The 🎬 weekly ballot, always open. Click My nomination to nominate a film (one each), then Vote and rank them. Chat in #general."
        preset: read_only       # Phase 19: commands still work (the text box stays)
      - key: watch_log           # next to #watch-planning (Phase 26; was in 📚 More)
        name: watch-log
        topic: "Every weekly pick, announced when the vote closes. @Weekly Pings is pinged here."
        preset: read_only
      - key: watch_party
        name: Voice
        type: voice
        adopt: Stream Room      # existing voice channel, renamed (was Watch Party)

  - key: movies
    name: "🍿 Movies"
    channels:
      - key: movies
        name: pre-watch         # was #movies (Phase 18); key unchanged
        type: forum
        default_sort: latest_activity
        topic: |
          🚫 NO SPOILERS in this channel. Trailers, hype and first impressions only.
          One post per movie, made by the bot. Nominate a film in #watch-planning to put it on the weekly ballot (that also adds its post here). This week's movie is pinned at the top.
          Seen it? Every post links to the movie's spoiler discussion in #post-watch.
          Slipped up? Right-click (long-press on mobile) a message → Apps → Mark as spoiler moves it to #post-watch.
        overwrites:
          "@everyone":
            allow: [send_messages_in_threads]
            deny: [send_messages]          # "Create Posts" in a forum
          "@bot":
            allow: [view_channel, send_messages, send_messages_in_threads, embed_links, manage_threads]
        tags:
          # Status tags: moderated = only members with Manage Threads (the bot) can apply them.
          - {key: backlog,     name: "Backlog",        emoji: "📋", moderated: true}
          - {key: up_next,     name: "Up Next",        emoji: "⏭️", moderated: true}
          - {key: watched,     name: "Watched",        emoji: "✅", moderated: true}
          - {key: watched_solo, name: "Watched (solo)", emoji: "👤", moderated: true}
          - {key: in_theaters, name: "In Theaters",    emoji: "🎟️", moderated: true}
          - {key: streaming,   name: "Streaming",      emoji: "📺", moderated: true}
          # Genre tags. tmdb_genres = TMDB genre names that map to this tag.
          - {key: g_action,    name: "Action",      tmdb_genres: [Action, War, Western]}
          - {key: g_adventure, name: "Adventure",   tmdb_genres: [Adventure]}
          - {key: g_animation, name: "Animation",   tmdb_genres: [Animation]}
          - {key: g_comedy,    name: "Comedy",      tmdb_genres: [Comedy]}
          - {key: g_crime,     name: "Crime",       tmdb_genres: [Crime, Mystery]}
          - {key: g_doc,       name: "Documentary", tmdb_genres: [Documentary]}
          - {key: g_drama,     name: "Drama",       tmdb_genres: [Drama, History]}
          - {key: g_fantasy,   name: "Fantasy",     tmdb_genres: [Fantasy, Family]}
          - {key: g_horror,    name: "Horror",      tmdb_genres: [Horror]}
          - {key: g_romance,   name: "Romance",     tmdb_genres: [Romance, Music]}
          - {key: g_scifi,     name: "Sci-Fi",      tmdb_genres: [Science Fiction]}
          - {key: g_thriller,  name: "Thriller",    tmdb_genres: [Thriller]}
          # 18 of Discord's 20-tag limit used.
        retire_tags:
          # Was "this movie has a post-watch discussion"; the info card button shows that.
          - {key: spoilers, name: "Post-watch"}
      - key: movie_spoilers
        name: post-watch
        type: forum
        default_sort: latest_activity
        topic: |
          ⚠️ SPOILERS ALLOWED. Only open a movie's post once you've seen it.
          One post per movie, made by the bot together with the movie's spoiler-free post in #pre-watch. Each post links back to it.
        overwrites:
          "@everyone":
            allow: [send_messages_in_threads]
            deny: [send_messages]          # only the bot creates posts
          "@bot":
            allow: [view_channel, send_messages, send_messages_in_threads, embed_links, manage_threads]
        # Phase 16. All moderated: the bot recomputes them from the DB
        # (filmbuffs/tags.py post_watch_tag_keys), at most 5 per post.
        tags:
          - {key: reviews,     name: "Reviews",     emoji: "📓", moderated: true}   # a Letterboxd review is posted here
          # Genres: same keys and names as the #movies genre tags (their tmdb_genres mapping is reused).
          - {key: g_action,    name: "Action",      moderated: true}
          - {key: g_adventure, name: "Adventure",   moderated: true}
          - {key: g_animation, name: "Animation",   moderated: true}
          - {key: g_comedy,    name: "Comedy",      moderated: true}
          - {key: g_crime,     name: "Crime",       moderated: true}
          - {key: g_doc,       name: "Documentary", moderated: true}
          - {key: g_drama,     name: "Drama",       moderated: true}
          - {key: g_fantasy,   name: "Fantasy",     moderated: true}
          - {key: g_horror,    name: "Horror",      moderated: true}
          - {key: g_romance,   name: "Romance",     moderated: true}
          - {key: g_scifi,     name: "Sci-Fi",      moderated: true}
          - {key: g_thriller,  name: "Thriller",    moderated: true}
          # Decades, one per post (from the release year).
          - {key: d_pre1980,   name: "Pre-1980",    moderated: true}
          - {key: d_1980s,     name: "1980s",       moderated: true}
          - {key: d_1990s,     name: "1990s",       moderated: true}
          - {key: d_2000s,     name: "2000s",       moderated: true}
          - {key: d_2010s,     name: "2010s",       moderated: true}
          - {key: d_2020s,     name: "2020s",       moderated: true}
          # 19 of Discord's 20-tag limit used.

  # Phase 14. Group categories (groups:) are inserted between 📚 More and Admin.
  - key: recap
    name: "📚 More"             # was 📊 Recap (Phase 18)
    channels:
      - key: letterboxd_feed
        name: letterboxd-feed
        topic: "New Letterboxd diary entries from linked members. Ratings and reviews are in each movie's #post-watch post."
        preset: read_only
      - key: ideas
        name: ideas
        topic: "Ideas for the server and the bot: post them here and talk them over. The pinned message lists the active ones."
        overwrites:
          "@bot":
            allow: [view_channel, send_messages, embed_links, read_message_history, pin_messages]

  - key: admin
    name: "🔧 Admin"
    channels:
      - key: bot_logs
        name: bot-logs
        topic: "Bot errors and health notices. Admins only."
        preset: admin_only

# Messages the bot posts and keeps up to date. {#key} becomes a channel link. `sections:` makes a
# Components V2 page instead of an embed; `pin: true` keeps it pinned.
messages:
  # One Components V2 page (Phase 15): a text block per section, dividers between.
  # Same key as the old Welcome embed, so it's converted in place (same message).
  - key: welcome_rules
    channel: welcome
    color: 0xE5A00D
    pin: true
    sections:
      - |
        # 🎬 Welcome to Film Buffs
        Each week we:
        1. Vote on next week's movie
        2. Watch this week's movie
        3. Chat about last week's movie
        This page explains how it all works; run **/help** any time for a list of commands.
      - |
        ## 🍿 Movies and spoilers
        Every movie gets **two** posts, so you never get spoiled by accident:
        - **{#movies}** is spoiler-free: trailers, hype and first impressions only.
        - **{#movie_spoilers}** is for after you've watched it: reviews, hot takes, impressions.
      - |
        ## 🗳️ Picking the weekly movie
        - **Nominate** a film in {#watch_planning} with the **My nomination** button to add it to this week's ballot.
        - **Vote** there with the **Vote** button. Each ballot closes on **Sunday night** at 11:59 PM CST.
        - **Watch** the active movie, which gets a server event and is listed in {#watch_log}.
        - **Note** that we use instant-runoff ranked choice voting. Your nomination and vote ranking carry over week to week.
      - |
        ## 📒 Letterboxd
        - **/letterboxd link** with your username. Your new diary entries show up on the movie's post, and the bot reads your public watchlist right away and again every day.
        - Optional: run **/letterboxd sync** and upload your Letterboxd export zip to bring in your entire diary and review history. It's the only way to get entries from before you linked.
      - |
        ## 🤝 Be nice
        Disagree about movies, not about people.

# Messages this script posted that should be deleted (key, title, channel).
# The embed title must still match.
retire_messages:
  - {key: how_to, title: "📖 How to", channel: welcome}   # merged into the Welcome page (Phase 15)

# Channels and categories this script created that should be deleted, by key
# (Phase 18). Same checks as `retire:` below; the key is forgotten once gone.
retire_managed:
  - {key: "channel:announcements", name: announcements}
  - {key: "channel:trailers",      name: trailers-and-news}
  - {key: "channel:wrapped",       name: wrapped}           # back with Phase 11 if wanted
  - {key: "channel:discussions",   name: Discussions}
  - {key: "category:chat",         name: "💬 Chat"}
  - {key: "category:planning",     name: "📅 Planning"}
  - {key: "category:voice",        name: "🔊 Voice"}

# Unmanaged channels to delete, by ID. The name must still match, text
# channels with messages are refused unless allow_messages: true, and a
# category is only deleted once it is empty. Entries for channels that are
# already gone are ignored, so these can stay here as a record.
retire:
  - {id: 1569765385744425052, name: games}            # empty
  - {id: 1569765385744425053, name: music}            # empty
  - {id: 1569765385744425050, name: Text Channels}    # empty once #general moves
  - {id: 1569765385744425054, name: Voice Channels}   # empty once voice channels move
